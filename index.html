<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGebra AI Studio - Đạo Hàm Tìm Cực Trị</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,8 94,88 6,88' fill='%2338bdf8' stroke='%23ffffff' stroke-width='6' stroke-linejoin='round'/%3E%3Cpolygon points='50,32 75,78 25,78' fill='%230f172a'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg-dark: #0b1120;
            --panel-bg: #151f32;
            --border-color: #2e3f5c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 10px 14px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); padding: 10px 16px; border-radius: 10px;
            border: 1px solid var(--border-color); flex-shrink: 0; flex-wrap: wrap; gap: 8px;
        }

        .brand-title { display: flex; align-items: center; gap: 10px; }
        .brand-title h1 { font-size: 1.15rem; color: var(--accent-blue); font-weight: 700; margin-right: 15px;}

        /* Bảng điều khiển View Toggle */
        .view-toggles { display: flex; gap: 6px; flex-wrap: wrap; background: #070b14; padding: 4px 8px; border-radius: 8px; border: 1px solid #1e293b; }
        
        button {
            cursor: pointer; border: none; border-radius: 6px; padding: 6px 12px;
            font-weight: 600; font-size: 0.85rem; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
        }
        
        .btn-toggle { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
        .btn-toggle.active { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border-color: var(--accent-blue); }
        .btn-primary { background: var(--accent-blue); color: #090d16; }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-success { background: var(--accent-green); color: #052e16; }
        .btn-warning { background: var(--accent-amber); color: #451a03; }

        .main-workspace {
            display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; flex: 1; min-height: 0;
        }

        .col-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; height: 100%;
        }

        /* 2D Graph */
        .graph-wrapper {
            position: relative; flex: 1; background: #070b14; border-radius: 8px;
            border: 1px solid #2e3f5c; overflow: hidden; min-height: 200px;
        }
        #graphCanvas { width: 100%; height: 100%; display: block; }

        /* Sim Box (Tank & Blind Man) */
        .sim-box {
            background: #070b14; border: 1px solid #2e3f5c; border-radius: 8px;
            height: 180px; flex-shrink: 0; position: relative; overflow: hidden; display: flex; flex-direction: column;
        }
        .sim-canvas { width: 100%; height: 100%; display: block; }
        
        .sim-header {
            position: absolute; top: 0; left: 0; right: 0; padding: 4px 10px;
            background: rgba(15, 23, 50, 0.8); border-bottom: 1px solid #2e3f5c;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        /* History Table */
        .history-wrapper {
            flex: 1; min-height: 0; background: #070b14; border: 1px solid var(--border-color);
            border-radius: 8px; overflow-y: auto; display: flex; flex-direction: column;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        th { background: #1e293b; color: var(--text-muted); padding: 8px; position: sticky; top: 0; font-weight: 600; border-bottom: 1px solid var(--border-color); }
        td { padding: 7px 8px; border-bottom: 1px solid #151f32; }
        .badge { padding: 2px 6px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
        .badge-neg { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge-pos { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-zero { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

        /* Sliders / Controls */
        .bottom-controls {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            background: #0b1120; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; flex-shrink: 0;
        }
        .param-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
        .param-group input[type="range"] { width: 90px; accent-color: var(--accent-blue); }

        /* Animation class for screen shake */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-active { animation: shake 0.3s; animation-iteration-count: 1; }

    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            <svg class="triangle-logo" viewBox="0 0 100 100">
                <polygon points="50,8 94,88 6,88" fill="#38bdf8" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
                <polygon points="50,32 75,78 25,78" fill="#0f172a"/>
            </svg>
            <h1>AI Gradient Descent Demo</h1>
        </div>

        <div class="view-toggles">
            <span style="font-size:0.8rem; color:#64748b; margin-right:4px; align-self:center;">Bật/Tắt:</span>
            <button id="togControls" class="btn-toggle active" onclick="toggleSection('controls')">🎛️ Bảng Thông Số</button>
            <button id="togTank" class="btn-toggle active" onclick="toggleSection('tank')">💥 Xe Tăng</button>
            <button id="togBlind" class="btn-toggle active" onclick="toggleSection('blind')">🦯 Người Mù (Parabol)</button>
        </div>
    </header>

    <div class="main-workspace">
        <!-- CỘT TRÁI: ĐỒ THỊ & ĐIỀU KHIỂN -->
        <div class="col-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 4px;">
                <span style="font-weight:700; color:var(--accent-blue); font-size:1.1rem;">Đồ Thị Hàm Số & Bi AI (f(x) = (x-2)²)</span>
                <span id="aiStatus" style="font-size:0.85rem; color:var(--accent-green); font-weight:600;">SẴN SÀNG KHẢO SÁT</span>
            </div>

            <!-- Vùng Vẽ Đồ Thị -->
            <div class="graph-wrapper">
                <canvas id="graphCanvas"></canvas>
            </div>

            <!-- Bảng Điều Khiển Lực Bắn (Có thể ẩn/hiện) -->
            <div id="controlsPanel" class="bottom-controls">
                <div style="display:flex; gap:8px;">
                    <button class="btn-warning" onclick="triggerSingleShot()">🔫 Bắn (1 Bước)</button>
                    <button id="autoBtn" class="btn-success" onclick="toggleAutoPlay()">▶️ AI Tự Động</button>
                    <button class="btn-toggle" onclick="resetSim()">🔄 Đặt lại</button>
                </div>

                <div style="display:flex; gap: 16px; flex-wrap:wrap;">
                    <div class="param-group">
                        <label>Vị trí (x): <b id="valX" style="color:#fff;">-2.50</b></label>
                        <input type="range" id="sliderX" min="-5" max="9" step="0.1" value="-2.5" oninput="onSliderX(this.value)">
                    </div>
                    <div class="param-group">
                        <label>Mục tiêu (x*): <b id="valTarget" style="color:var(--accent-green);">2.0</b></label>
                        <input type="range" id="sliderTarget" min="0" max="6" step="0.5" value="2.0" oninput="onSliderTarget(this.value)">
                    </div>
                    <div class="param-group">
                        <label>Hệ số α: <b id="valAlpha" style="color:var(--accent-purple);">0.15</b></label>
                        <input type="range" id="sliderAlpha" min="0.02" max="0.5" step="0.01" value="0.15" oninput="onSliderAlpha(this.value)">
                    </div>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: MÔ PHỎNG & LỊCH SỬ -->
        <div class="col-panel" id="rightPanel">
            
            <!-- Mô phỏng Xe tăng -->
            <div id="tankPanel" class="sim-box">
                <div class="sim-header">
                    <span style="font-size:0.8rem; font-weight:700; color:#38bdf8;">💥 XE TĂNG AI (Hàm 1 Biến - Cố định nòng)</span>
                    <span id="tankInfo" style="font-size:0.75rem; color:#94a3b8;">x* = 2.0</span>
                </div>
                <canvas id="tankCanvas" class="sim-canvas"></canvas>
            </div>

            <!-- Mô phỏng Người Mù dò dốc (Mới) -->
            <div id="blindPanel" class="sim-box">
                <div class="sim-header">
                    <span style="font-size:0.8rem; font-weight:700; color:#f59e0b;">🦯 NGƯỜI MÙ DÒ DỐC (Gradient Descent Trực Quan)</span>
                    <span id="blindInfo" style="font-size:0.75rem; color:#94a3b8;">Dùng gậy cảm nhận độ dốc</span>
                </div>
                <canvas id="blindCanvas" class="sim-canvas"></canvas>
            </div>

            <!-- Bảng Lịch Sử (Auto co giãn) -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                <span style="font-weight:700; font-size:0.95rem;">📋 Lịch Sử "Mò Đường"</span>
            </div>
            <div class="history-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Lần</th>
                            <th>Vị trí (x)</th>
                            <th>Đạo hàm f'(x)</th>
                            <th>Quyết định AI</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="4" style="text-align:center; color:#64748b; padding:15px;">Chưa có dữ liệu</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // ================== TRẠNG THÁI & HÀM SỐ ==================
    let state = {
        x: -2.5,
        targetX: 2.0,
        alpha: 0.15,
        history: [],
        stepCount: 0,
        isAuto: false,
        animPhase: 'IDLE', // IDLE, FLYING, EXPLODING, MOVING
        projT: 0,
        expTimer: 0,
        moveFrom: 0, moveTo: 0, moveT: 0,
        tankRecoil: 0, // Độ giật xe tăng
        muzzleFlash: 0
    };

    let views = {
        controls: true,
        tank: true,
        blind: true
    };

    // Hàm Parabol: y = f(x) = (x - x*)^2
    function f(x) { return Math.pow(x - state.targetX, 2); }
    // Đạo hàm: f'(x) = 2(x - x*)
    function df(x) { return 2 * (x - state.targetX); }

    // ================== DOM & CANVAS ==================
    const graphCv = document.getElementById('graphCanvas');
    const gCtx = graphCv.getContext('2d');
    
    const tankCv = document.getElementById('tankCanvas');
    const tCtx = tankCv.getContext('2d');
    
    const blindCv = document.getElementById('blindCanvas');
    const bCtx = blindCv.getContext('2d');

    const historyBody = document.getElementById('historyBody');

    // ================== VIEW TOGGLES ==================
    function toggleSection(sec) {
        views[sec] = !views[sec];
        document.getElementById('tog' + sec.charAt(0).toUpperCase() + sec.slice(1)).classList.toggle('active', views[sec]);
        
        if (sec === 'controls') {
            document.getElementById('controlsPanel').style.display = views.controls ? 'flex' : 'none';
        } else if (sec === 'tank') {
            document.getElementById('tankPanel').style.display = views.tank ? 'flex' : 'none';
        } else if (sec === 'blind') {
            document.getElementById('blindPanel').style.display = views.blind ? 'flex' : 'none';
        }
        resizeCanvases();
    }

    function resizeCanvases() {
        [graphCv, tankCv, blindCv].forEach(cv => {
            const rect = cv.parentElement.getBoundingClientRect();
            // Đảm bảo không dính kích thước 0
            if (rect.width > 0 && rect.height > 0) {
                cv.width = rect.width;
                cv.height = rect.height;
            }
        });
    }
    window.addEventListener('resize', resizeCanvases);

    // ================== ĐIỀU KHIỂN SLIDERS ==================
    function onSliderX(val) {
        if(state.animPhase !== 'IDLE') return;
        state.x = parseFloat(val);
        document.getElementById('valX').innerText = state.x.toFixed(2);
        updateStatus();
    }
    function onSliderTarget(val) {
        if(state.animPhase !== 'IDLE') return;
        state.targetX = parseFloat(val);
        document.getElementById('valTarget').innerText = state.targetX.toFixed(1);
        document.getElementById('tankInfo').innerText = `x* = ${state.targetX.toFixed(1)}`;
        updateStatus();
    }
    function onSliderAlpha(val) {
        state.alpha = parseFloat(val);
        document.getElementById('valAlpha').innerText = state.alpha.toFixed(2);
    }

    function resetSim() {
        state.isAuto = false;
        document.getElementById('autoBtn').innerHTML = "▶️ AI Tự Động";
        document.getElementById('autoBtn').className = "btn-success";
        state.x = -2.5; state.stepCount = 0; state.history = []; state.animPhase = 'IDLE';
        document.getElementById('sliderX').value = state.x;
        document.getElementById('valX').innerText = state.x.toFixed(2);
        historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#64748b; padding:15px;">Đã đặt lại vị trí</td></tr>`;
        updateStatus();
    }

    // ================== LOGIC AI (GRADIENT DESCENT) ==================
    function computeNextX(currentX, slope) {
        let nX = currentX - state.alpha * slope;
        // Chống văng ra ngoài khung
        if(nX < -6) nX = -6; if(nX > 10) nX = 10;
        return nX;
    }

    function triggerSingleShot() {
        if(state.animPhase !== 'IDLE') return;
        state.stepCount++;
        state.animPhase = 'FLYING';
        state.projT = 0;
        state.tankRecoil = 8; // Giật lùi xe tăng 8px
        state.muzzleFlash = 1.0;
        updateStatus("ĐANG BẮN THỬ...");
    }

    function toggleAutoPlay() {
        state.isAuto = !state.isAuto;
        const btn = document.getElementById('autoBtn');
        if(state.isAuto) {
            btn.innerHTML = "⏸️ Dừng Auto"; btn.className = "btn-toggle";
            if(state.animPhase === 'IDLE') triggerSingleShot();
        } else {
            btn.innerHTML = "▶️ AI Tự Động"; btn.className = "btn-success";
        }
    }

    function updateStatus(msgOverride = null) {
        const statusEl = document.getElementById('aiStatus');
        const slope = df(state.x);
        if (msgOverride) {
            statusEl.innerText = msgOverride;
            statusEl.style.color = "#f59e0b";
        } else if (Math.abs(slope) < 0.1) {
            statusEl.innerText = "🏆 ĐÃ TỚI ĐÁY CỰC TIỂU!";
            statusEl.style.color = "#22c55e";
        } else {
            statusEl.innerText = `SẴN SÀNG (Đạo hàm: ${slope.toFixed(2)})`;
            statusEl.style.color = "#38bdf8";
        }
    }

    function logHistory(x, slope, nX) {
        if(state.stepCount === 1) historyBody.innerHTML = "";
        let decHtml = Math.abs(slope) < 0.1 
            ? `<span style="color:#22c55e; font-weight:bold;">🎯 Đáy (Dừng)</span>`
            : (slope < 0 ? `<span style="color:#38bdf8;">Tăng x ➔ ${nX.toFixed(2)}</span>` : `<span style="color:#f87171;">Giảm x ➔ ${nX.toFixed(2)}</span>`);
        
        let slpHtml = Math.abs(slope) < 0.1 
            ? `<span class="badge badge-zero">0.00</span>`
            : (slope < 0 ? `<span class="badge badge-neg">${slope.toFixed(2)} (Âm)</span>` : `<span class="badge badge-pos">+${slope.toFixed(2)} (Dương)</span>`);

        const tr = document.createElement('tr');
        tr.innerHTML = `<td>#${state.stepCount}</td><td><b>${x.toFixed(2)}</b></td><td>${slpHtml}</td><td>${decHtml}</td>`;
        historyBody.prepend(tr);
    }

    // ================== VẼ ĐỒ THỊ 2D ==================
    function drawGraph() {
        const w = graphCv.width, h = graphCv.height;
        if(w === 0 || h === 0) return;
        gCtx.clearRect(0, 0, w, h);
        
        // Setup tọa độ: x từ -6 đến 10, y từ -2 đến 30
        const xMin = -6, xMax = 10, yMin = -2, yMax = 30;
        const toPx = (mathX) => ((mathX - xMin) / (xMax - xMin)) * w;
        const toPy = (mathY) => h - ((mathY - yMin) / (yMax - yMin)) * h;

        // Trục Ox, Oy
        gCtx.strokeStyle = "#475569"; gCtx.lineWidth = 1.5;
        gCtx.beginPath();
        gCtx.moveTo(0, toPy(0)); gCtx.lineTo(w, toPy(0));
        gCtx.moveTo(toPx(0), 0); gCtx.lineTo(toPx(0), h);
        gCtx.stroke();
        gCtx.fillStyle = "#94a3b8"; gCtx.font = "12px sans-serif";
        gCtx.fillText("x", w - 15, toPy(0) - 5); gCtx.fillText("y", toPx(0) + 8, 15);

        // Vẽ Parabol y = (x - x*)^2
        gCtx.strokeStyle = "#38bdf8"; gCtx.lineWidth = 3;
        gCtx.beginPath();
        for(let px = 0; px <= w; px+=2) {
            let mx = xMin + (px/w)*(xMax - xMin);
            let my = f(mx);
            if(px===0) gCtx.moveTo(px, toPy(my)); else gCtx.lineTo(px, toPy(my));
        }
        gCtx.stroke();

        // Đích (Đáy)
        const targPx = toPx(state.targetX), targPy = toPy(0);
        gCtx.fillStyle = "#22c55e"; gCtx.beginPath(); gCtx.arc(targPx, targPy, 5, 0, Math.PI*2); gCtx.fill();
        
        // Vẽ bi AI và Tiếp tuyến
        const cX = state.x, cY = f(cX), slope = df(cX);
        const bPx = toPx(cX), bPy = toPy(cY);
        
        // Đường Gióng xuống trục Ox
        gCtx.strokeStyle = "rgba(148, 163, 184, 0.4)"; gCtx.setLineDash([4,4]);
        gCtx.beginPath(); gCtx.moveTo(bPx, bPy); gCtx.lineTo(bPx, toPy(0)); gCtx.stroke(); gCtx.setLineDash([]);

        // Tiếp tuyến (Màu cam)
        const tLen = 2; // chiều dài đoạn tiếp tuyến trên hệ tọa độ toán
        const x1 = cX - tLen, y1 = cY - slope*tLen;
        const x2 = cX + tLen, y2 = cY + slope*tLen;
        gCtx.strokeStyle = "#f59e0b"; gCtx.lineWidth = 2;
        gCtx.beginPath(); gCtx.moveTo(toPx(x1), toPy(y1)); gCtx.lineTo(toPx(x2), toPy(y2)); gCtx.stroke();

        // Bi AI
        gCtx.fillStyle = "#fff"; gCtx.strokeStyle = "#0ea5e9"; gCtx.lineWidth = 3;
        gCtx.beginPath(); gCtx.arc(bPx, bPy, 7, 0, Math.PI*2); gCtx.fill(); gCtx.stroke();
    }

    // ================== VẼ XE TĂNG (MẠNH HƠN) ==================
    function drawTank() {
        if(!views.tank) return;
        const w = tankCv.width, h = tankCv.height;
        if(w === 0 || h === 0) return;
        tCtx.clearRect(0, 0, w, h);

        const groundY = h - 20;
        // Mặt đất
        tCtx.fillStyle = "#1e293b"; tCtx.fillRect(0, groundY, w, 20);
        tCtx.strokeStyle = "#475569"; tCtx.beginPath(); tCtx.moveTo(0, groundY); tCtx.lineTo(w, groundY); tCtx.stroke();

        const xMin = -6, xMax = 10;
        const toPx = (mathX) => w*0.1 + ((mathX - xMin) / (xMax - xMin)) * (w*0.8);
        
        // Đích
        const tPx = toPx(state.targetX);
        tCtx.fillStyle = "#ef4444"; tCtx.beginPath(); tCtx.arc(tPx, groundY, 8, Math.PI, 0); tCtx.fill();
        
        // Xe tăng (Có giật lùi tankRecoil)
        const tankBasePx = 20 - state.tankRecoil;
        tCtx.fillStyle = "#38bdf8"; tCtx.fillRect(tankBasePx, groundY - 15, 45, 15); // Thân
        tCtx.beginPath(); tCtx.arc(tankBasePx + 25, groundY - 15, 10, Math.PI, 0); tCtx.fill(); // Tháp pháo
        // Nòng súng (Góc cố định, dài ra tí cho uy lực)
        tCtx.strokeStyle = "#7dd3fc"; tCtx.lineWidth = 4;
        const nNongX = tankBasePx + 30, nNongY = groundY - 20;
        const muiNongX = nNongX + 30, muiNongY = nNongY - 15;
        tCtx.beginPath(); tCtx.moveTo(nNongX, nNongY); tCtx.lineTo(muiNongX, muiNongY); tCtx.stroke();

        // Chớp lửa (Muzzle Flash - Rất bự)
        if(state.muzzleFlash > 0) {
            tCtx.fillStyle = `rgba(253, 224, 71, ${state.muzzleFlash})`;
            tCtx.beginPath(); tCtx.arc(muiNongX + 5, muiNongY - 2, 15 * state.muzzleFlash, 0, Math.PI*2); tCtx.fill();
            state.muzzleFlash -= 0.1;
        }
        if(state.tankRecoil > 0) state.tankRecoil *= 0.8; // Hồi vị trí giật

        // Đạn bay & Vụ nổ (Uy lực hơn)
        const cPx = toPx(state.currentFlightX || state.x); // x đang bay
        
        if (state.animPhase === 'FLYING') {
            const t = state.projT;
            const startX = muiNongX, startY = muiNongY;
            const endX = toPx(state.x), endY = groundY;
            const ctrlX = (startX + endX)/2, ctrlY = Math.min(startY, endY) - 80; // Quỹ đạo cầu vồng cao
            
            const bX = (1-t)*(1-t)*startX + 2*(1-t)*t*ctrlX + t*t*endX;
            const bY = (1-t)*(1-t)*startY + 2*(1-t)*t*ctrlY + t*t*endY;
            
            // Đạn sáng rực
            tCtx.fillStyle = "#fef08a"; tCtx.beginPath(); tCtx.arc(bX, bY, 4, 0, Math.PI*2); tCtx.fill();
        } else if (state.animPhase === 'EXPLODING' || state.stepCount > 0) {
            const ePx = toPx(state.x);
            // Vụ nổ bự
            let r = state.animPhase === 'EXPLODING' ? 20 - state.expTimer : 5;
            if(r < 0) r = 0;
            const isHit = Math.abs(state.x - state.targetX) < 0.2;
            tCtx.fillStyle = isHit ? `rgba(34, 197, 94, ${r/20 + 0.3})` : `rgba(239, 68, 68, ${r/20 + 0.3})`;
            tCtx.beginPath(); tCtx.arc(ePx, groundY, r, 0, Math.PI*2); tCtx.fill();
        }
    }

    // ================== VẼ NGƯỜI MÙ DÒ DỐC (MỚI) ==================
    function drawBlindMan() {
        if(!views.blind) return;
        const w = blindCv.width, h = blindCv.height;
        if(w === 0 || h === 0) return;
        bCtx.clearRect(0, 0, w, h);

        const xMin = -6, xMax = 10, yMin = -2, yMax = 30;
        const toPx = (mx) => ((mx - xMin) / (xMax - xMin)) * w;
        const toPy = (my) => h - 20 - ((my - yMin) / (yMax - yMin)) * (h - 40); // co lại xíu cho khỏi đụng trần

        // Vẽ Đồi Parabol (Đất màu xanh lá mạ)
        bCtx.fillStyle = "#064e3b";
        bCtx.beginPath();
        bCtx.moveTo(0, h);
        for(let px = 0; px <= w; px+=2) {
            let mx = xMin + (px/w)*(xMax - xMin);
            let my = f(mx);
            bCtx.lineTo(px, toPy(my));
        }
        bCtx.lineTo(w, h);
        bCtx.fill();
        
        // Viền đồi
        bCtx.strokeStyle = "#10b981"; bCtx.lineWidth = 3;
        bCtx.beginPath();
        for(let px = 0; px <= w; px+=2) {
            let mx = xMin + (px/w)*(xMax - xMin);
            if(px===0) bCtx.moveTo(px, toPy(f(mx))); else bCtx.lineTo(px, toPy(f(mx)));
        }
        bCtx.stroke();

        // Đích (Lá cờ cắm ở đáy)
        const tPx = toPx(state.targetX), tPy = toPy(0);
        bCtx.strokeStyle = "#fff"; bCtx.lineWidth = 2;
        bCtx.beginPath(); bCtx.moveTo(tPx, tPy); bCtx.lineTo(tPx, tPy - 25); bCtx.stroke();
        bCtx.fillStyle = "#ef4444"; bCtx.fillRect(tPx, tPy - 25, 12, 10);

        // Vẽ Người Mù tại vị trí hiện tại
        const drawX = (state.animPhase === 'FLYING' || state.animPhase === 'EXPLODING') ? state.moveFrom : state.x;
        // Nếu đang Moving, vẽ ở giữa đường
        const renderX = state.animPhase === 'MOVING' ? (state.moveFrom + (state.moveTo - state.moveFrom) * state.moveT) : state.x;
        
        const pPx = toPx(renderX);
        const pPy = toPy(f(renderX));
        const slope = df(renderX);
        
        // Vẽ Nhân vật (Stick figure)
        bCtx.strokeStyle = "#f8fafc"; bCtx.lineWidth = 2.5; bCtx.lineCap = "round";
        
        // Thân & Đầu
        bCtx.beginPath();
        bCtx.arc(pPx, pPy - 30, 4, 0, Math.PI*2); // Đầu
        bCtx.moveTo(pPx, pPy - 26); bCtx.lineTo(pPx, pPy - 10); // Thân
        // Chân
        bCtx.moveTo(pPx, pPy - 10); bCtx.lineTo(pPx - 4, pPy - 2); 
        bCtx.moveTo(pPx, pPy - 10); bCtx.lineTo(pPx + 4, pPy - 2);
        bCtx.stroke();
        
        // Cây gậy dò đường (Nghiêng theo Đạo Hàm)
        // Góc nghiêng theta = atan(slope * he_so_visual)
        const theta = Math.atan(slope * 0.2); // 0.2 là hệ số bóp visual cho đỡ gắt
        bCtx.save();
        bCtx.translate(pPx, pPy - 15); // Điểm nắm gậy ở cánh tay
        bCtx.rotate(-theta); // Rotate ngược chiều Y canvas
        bCtx.strokeStyle = "#f59e0b"; bCtx.lineWidth = 3;
        bCtx.beginPath(); bCtx.moveTo(0, 0); bCtx.lineTo(25, 0); // Vẽ gậy dài 25px
        bCtx.stroke();
        bCtx.restore();
        
        // Chữ chú thích góc gậy
        bCtx.fillStyle = "#fcd34d"; bCtx.font = "10px sans-serif";
        bCtx.fillText(slope < -0.1 ? "Gậy chúc xuống ↘" : (slope > 0.1 ? "Gậy hếch lên ↗" : "Gậy ngang (Đáy)"), pPx - 20, pPy - 40);
    }

    // ================== VÒNG LẶP ANIMATION ==================
    function loop() {
        if (state.animPhase === 'FLYING') {
            state.projT += 0.05; // Đạn bay nhanh hơn
            if (state.projT >= 1) {
                state.animPhase = 'EXPLODING';
                state.expTimer = 0;
                
                // Rung màn hình khi nổ
                document.getElementById('tankPanel').classList.add('shake-active');
                setTimeout(() => document.getElementById('tankPanel').classList.remove('shake-active'), 300);

                const slope = df(state.x);
                state.moveFrom = state.x;
                state.moveTo = computeNextX(state.x, slope);
                logHistory(state.x, slope, state.moveTo);
                
                if (Math.abs(slope) < 0.1) updateStatus("🎯 TRÚNG ĐÍCH!");
                else updateStatus(slope < 0 ? "Đạo hàm Âm ➔ Tăng lực" : "Đạo hàm Dương ➔ Giảm lực");
            }
        } else if (state.animPhase === 'EXPLODING') {
            state.expTimer++;
            if (state.expTimer > 15) { // Dừng ngắn hơn xíu
                const slope = df(state.x);
                if (Math.abs(slope) < 0.1) {
                    state.animPhase = 'IDLE';
                    state.isAuto = false;
                    document.getElementById('autoBtn').innerHTML = "▶️ AI Tự Động";
                    document.getElementById('autoBtn').className = "btn-success";
                } else {
                    state.animPhase = 'MOVING';
                    state.moveT = 0;
                }
            }
        } else if (state.animPhase === 'MOVING') {
            state.moveT += 0.08;
            state.x = state.moveFrom + (state.moveTo - state.moveFrom) * state.moveT;
            // Đồng bộ thanh trượt
            document.getElementById('sliderX').value = state.x;
            document.getElementById('valX').innerText = state.x.toFixed(2);
            
            if (state.moveT >= 1) {
                state.x = state.moveTo;
                state.animPhase = 'IDLE';
                updateStatus();
                if (state.isAuto) setTimeout(() => { if(state.isAuto && state.animPhase === 'IDLE') triggerSingleShot(); }, 200);
            }
        }

        drawGraph();
        drawTank();
        drawBlindMan();
        requestAnimationFrame(loop);
    }

    // Khởi động
    resizeCanvases();
    requestAnimationFrame(loop);
</script>
