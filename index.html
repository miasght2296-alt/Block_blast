<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast - Xếp Hình Kiểu Mới</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      touch-action: none; /* Prevent scroll on drag */
      overflow: hidden;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 2px;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      transition: background-color 0.1s;
    }

    .cell.filled {
      box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
    }

    .cell-preview {
      background-color: rgba(255, 255, 255, 0.4) !important;
    }

    .tray-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      height: 120px;
      margin-top: 20px;
    }

    .shape-container {
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .shape {
      display: grid;
      gap: 2px;
      cursor: grab;
      position: absolute;
      /* Default scale in tray */
      transform: scale(0.6);
      transition: transform 0.1s;
    }

    .shape:active, .shape.dragging {
      cursor: grabbing;
      transform: scale(1);
      z-index: 100;
    }

    .shape-block {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.3);
    }

    .anim-clear {
      animation: popOut 0.3s forwards;
    }

    @keyframes popOut {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* Colors for blocks */
    .color-1 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
    .color-2 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
    .color-3 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
    .color-4 { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
    .color-5 { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
    .color-6 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[400px] flex justify-between items-center mb-6 px-2">
    <div>
      <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-orange-500 drop-shadow-md">BLOCK BLAST</h1>
      <p class="text-sm text-blue-200">Xếp hình kiểu mới</p>
    </div>
    <div class="text-right">
      <div class="text-blue-200 text-xs font-bold uppercase tracking-wider">Điểm số</div>
      <div id="scoreDisplay" class="text-3xl font-black text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]">0</div>
    </div>
  </div>

  <div class="w-full max-w-[400px]">
    <div id="board" class="game-board">
      <!-- 64 cells generated by JS -->
    </div>
  </div>

  <div class="w-full max-w-[400px]">
    <div id="tray" class="tray-container">
      <div class="shape-container" id="slot-0"></div>
      <div class="shape-container" id="slot-1"></div>
      <div class="shape-container" id="slot-2"></div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center hidden backdrop-blur-sm z-[200]">
    <h2 class="text-5xl font-black text-red-500 mb-2 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">HẾT NƯỚC ĐI</h2>
    <p class="text-xl text-white mb-8">Điểm của bạn: <span id="finalScore" class="font-bold text-yellow-400">0</span></p>
    <button onclick="initGame()" class="px-8 py-3 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full font-bold text-xl shadow-lg shadow-blue-500/50 hover:scale-105 active:scale-95 transition-transform">
      Chơi Lại
    </button>
  </div>

  <script>
    const BOARD_SIZE = 8;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('scoreDisplay');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    
    let board = [];
    let score = 0;
    let currentShapes = [];
    let draggingShape = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    
    // Cell size roughly calculated for math
    let CELL_PIXEL_SIZE = 40; 
    let BOARD_RECT = null;

    // Define shapes (matrix form)
    const SHAPES = [
      { mat: [[1]], color: 'color-1' }, // 1x1
      { mat: [[1,1]], color: 'color-2' }, // 2x1
      { mat: [[1],[1]], color: 'color-2' }, // 1x2
      { mat: [[1,1,1]], color: 'color-3' }, // 3x1
      { mat: [[1],[1],[1]], color: 'color-3' }, // 1x3
      { mat: [[1,1,1,1]], color: 'color-4' }, // 4x1
      { mat: [[1],[1],[1],[1]], color: 'color-4' }, // 1x4
      { mat: [[1,1],[1,1]], color: 'color-5' }, // 2x2
      { mat: [[1,1,1],[1,1,1],[1,1,1]], color: 'color-6' }, // 3x3
      { mat: [[1,1],[1,0]], color: 'color-1' }, // L-small
      { mat: [[1,1],[0,1]], color: 'color-1' }, 
      { mat: [[1,0],[1,1]], color: 'color-1' }, 
      { mat: [[0,1],[1,1]], color: 'color-1' },
      { mat: [[1,1,1],[1,0,0],[1,0,0]], color: 'color-4' }, // L-large
      { mat: [[1,1,1],[0,0,1],[0,0,1]], color: 'color-4' },
      { mat: [[0,0,1],[0,0,1],[1,1,1]], color: 'color-4' },
      { mat: [[1,0,0],[1,0,0],[1,1,1]], color: 'color-4' }
    ];

    function initGame() {
      board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
      score = 0;
      updateScore(0);
      gameOverScreen.classList.add('hidden');
      createBoardUI();
      fillTray();
      
      // Calculate sizes after rendering
      setTimeout(() => {
        BOARD_RECT = boardEl.getBoundingClientRect();
        const firstCell = boardEl.children[0].getBoundingClientRect();
        CELL_PIXEL_SIZE = firstCell.width + 2; // +gap
      }, 100);
    }

    function createBoardUI() {
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          boardEl.appendChild(cell);
        }
      }
    }

    function getRandomShape() {
      const template = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return JSON.parse(JSON.stringify(template)); // deep copy
    }

    function fillTray() {
      currentShapes = [getRandomShape(), getRandomShape(), getRandomShape()];
      renderTray();
      checkGameOver();
    }

    function renderTray() {
      for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`slot-${i}`);
        slot.innerHTML = '';
        const shape = currentShapes[i];
        if (shape) {
          const shapeEl = document.createElement('div');
          shapeEl.className = 'shape';
          
          const rows = shape.mat.length;
          const cols = shape.mat[0].length;
          shapeEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
          shapeEl.style.gridTemplateRows = `repeat(${rows}, 32px)`;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const block = document.createElement('div');
              if (shape.mat[r][c]) {
                block.className = `shape-block ${shape.color}`;
              }
              shapeEl.appendChild(block);
            }
          }

          shapeEl.addEventListener('pointerdown', (e) => startDrag(e, shape, i, shapeEl));
          slot.appendChild(shapeEl);
        }
      }
    }

    function startDrag(e, shape, index, shapeEl) {
      if(draggingShape) return;
      e.preventDefault();
      
      // Set to absolute position attached to body
      const rect = shapeEl.getBoundingClientRect();
      // Offset so the shape centers above the finger
      dragOffsetX = rect.width / 2;
      dragOffsetY = rect.height / 2 + 30; // 30px offset so finger doesn't hide it
      
      draggingShape = { shape, index, el: shapeEl, startSlot: shapeEl.parentElement };
      
      document.body.appendChild(shapeEl);
      shapeEl.classList.add('dragging');
      
      moveDrag(e);
      
      document.addEventListener('pointermove', moveDrag);
      document.addEventListener('pointerup', endDrag);
    }

    function moveDrag(e) {
      if (!draggingShape) return;
      const x = e.clientX;
      const y = e.clientY;
      
      draggingShape.el.style.left = `${x - dragOffsetX}px`;
      draggingShape.el.style.top = `${y - dragOffsetY}px`;

      updatePreview(x, y);
    }

    function getGridHoverPos(clientX, clientY) {
      if (!BOARD_RECT) BOARD_RECT = boardEl.getBoundingClientRect();
      
      // Calculate top-left of the shape based on current finger pos
      const shapeRect = draggingShape.el.getBoundingClientRect();
      
      // Check if shape is over the board
      const boardLeft = BOARD_RECT.left;
      const boardTop = BOARD_RECT.top;
      
      // Get relative position of the top-left block of the shape to the board
      // Use the center of the top-left block of the shape to determine row/col
      const targetX = shapeRect.left + 16; 
      const targetY = shapeRect.top + 16;

      if (targetX >= boardLeft && targetX <= BOARD_RECT.right &&
          targetY >= boardTop && targetY <= BOARD_RECT.bottom) {
          
          const col = Math.floor((targetX - boardLeft) / CELL_PIXEL_SIZE);
          const row = Math.floor((targetY - boardTop) / CELL_PIXEL_SIZE);
          return {r: row, c: col};
      }
      return null;
    }

    function canPlace(shapeMat, row, col) {
      for (let r = 0; r < shapeMat.length; r++) {
        for (let c = 0; c < shapeMat[0].length; c++) {
          if (shapeMat[r][c]) {
            const br = row + r;
            const bc = col + c;
            if (br < 0 || br >= BOARD_SIZE || bc < 0 || bc >= BOARD_SIZE || board[br][bc] !== 0) {
              return false;
            }
          }
        }
      }
      return true;
    }

    function updatePreview(x, y) {
      // Clear old previews
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('cell-preview'));
      
      const pos = getGridHoverPos(x, y);
      if (pos && canPlace(draggingShape.shape.mat, pos.r, pos.c)) {
        // Draw new preview
        const mat = draggingShape.shape.mat;
        for (let r = 0; r < mat.length; r++) {
          for (let c = 0; c < mat[0].length; c++) {
            if (mat[r][c]) {
              const cell = boardEl.children[(pos.r + r) * BOARD_SIZE + (pos.c + c)];
              cell.classList.add('cell-preview');
            }
          }
        }
      }
    }

    function endDrag(e) {
      if (!draggingShape) return;
      document.removeEventListener('pointermove', moveDrag);
      document.removeEventListener('pointerup', endDrag);

      const pos = getGridHoverPos(e.clientX, e.clientY);
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('cell-preview'));

      if (pos && canPlace(draggingShape.shape.mat, pos.r, pos.c)) {
        // Place it
        placeShape(draggingShape.shape, pos.r, pos.c);
        currentShapes[draggingShape.index] = null;
        draggingShape.el.remove();
        
        // Add score for placing
        const blocksCount = draggingShape.shape.mat.flat().filter(v => v).length;
        updateScore(blocksCount);
        
        checkLines();
        
        // If all shapes used, refill
        if (currentShapes.every(s => s === null)) {
          fillTray();
        } else {
          checkGameOver();
        }
      } else {
        // Return to tray
        draggingShape.startSlot.appendChild(draggingShape.el);
        draggingShape.el.style.left = '';
        draggingShape.el.style.top = '';
        draggingShape.el.classList.remove('dragging');
      }

      draggingShape = null;
    }

    function placeShape(shape, row, col) {
      const mat = shape.mat;
      for (let r = 0; r < mat.length; r++) {
        for (let c = 0; c < mat[0].length; c++) {
          if (mat[r][c]) {
            board[row + r][col + c] = shape.color;
            const cell = boardEl.children[(row + r) * BOARD_SIZE + (col + c)];
            cell.className = `cell filled ${shape.color}`;
          }
        }
      }
    }

    function checkLines() {
      let rowsToClear = [];
      let colsToClear = [];

      // Check rows
      for (let r = 0; r < BOARD_SIZE; r++) {
        if (board[r].every(c => c !== 0)) rowsToClear.push(r);
      }
      
      // Check cols
      for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (board[r][c] === 0) full = false;
        }
        if (full) colsToClear.push(c);
      }

      if (rowsToClear.length === 0 && colsToClear.length === 0) return;

      // Calculate combos
      const totalLines = rowsToClear.length + colsToClear.length;
      updateScore(totalLines * 10 * totalLines); // Combo multiplier

      // Animate and clear
      rowsToClear.forEach(r => {
        for(let c=0; c<BOARD_SIZE; c++) {
           const cell = boardEl.children[r * BOARD_SIZE + c];
           cell.classList.add('anim-clear');
           board[r][c] = 0;
        }
      });
      
      colsToClear.forEach(c => {
        for(let r=0; r<BOARD_SIZE; r++) {
           const cell = boardEl.children[r * BOARD_SIZE + c];
           cell.classList.add('anim-clear');
           board[r][c] = 0;
        }
      });

      setTimeout(() => {
        // Reset classes
        for(let r=0; r<BOARD_SIZE; r++) {
          for(let c=0; c<BOARD_SIZE; c++) {
            if(board[r][c] === 0) {
              boardEl.children[r * BOARD_SIZE + c].className = 'cell';
            }
          }
        }
      }, 300);
    }

    function checkGameOver() {
      // Check if ANY of the current shapes can be placed ANYWHERE
      let canPlay = false;
      
      for (let s of currentShapes) {
        if (s === null) continue;
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (canPlace(s.mat, r, c)) {
              canPlay = true;
              break;
            }
          }
          if (canPlay) break;
        }
        if (canPlay) break;
      }

      if (!canPlay) {
        finalScoreEl.innerText = score;
        gameOverScreen.classList.remove('hidden');
      }
    }

    function updateScore(add) {
      score += add;
      scoreEl.innerText = score;
      // Simple animation
      scoreEl.style.transform = 'scale(1.3)';
      setTimeout(() => { scoreEl.style.transform = 'scale(1)'; }, 150);
    }

    // Start
    initGame();

  </script>
</body>
</html>
